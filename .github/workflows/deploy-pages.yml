name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static export build
        run: node scripts/build-static.mjs
        env:
          # 仓库 Variables（可选）：
          #   CUSTOM_DOMAIN   自定义域名（如 www.oooe.me）→ 自动根路径部署 + 写入 CNAME
          #   SITE_URL        站点公开 URL（默认按 CUSTOM_DOMAIN 或 github.io 推导）
          #   PAGES_BASE_PATH 强制指定子路径（一般不必设）
          # 未设任何变量时：部署在 https://<owner>.github.io/<repo>/ 子路径下
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          SITE_URL: ${{ vars.SITE_URL }}
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
          DEFAULT_BASE_PATH: /${{ github.event.repository.name }}
          DEFAULT_SERVER_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: '1'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
